<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Storybooks — Susquehanna University</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --earth: #2D4A3E;
    --moss: #4A7C59;
    --sage: #8FB5A0;
    --sky: #B8D4E3;
    --sand: #F2ECD8;
    --amber: #D4873A;
    --cream: #FAF7F0;
    --ink: #1A2820;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: var(--earth);
    padding: 0;
    position: relative;
    overflow: hidden;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .header-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 80% 20%, rgba(74,124,89,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 10% 80%, rgba(184,212,227,0.2) 0%, transparent 50%);
  }

  .header-content {
    position: relative;
    z-index: 2;
    padding: 48px 60px 48px;
    max-width: 900px;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 16px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 700;
    color: var(--sand);
    line-height: 1.1;
    margin-bottom: 16px;
  }

  header h1 em {
    color: var(--sage);
    font-style: italic;
  }

  header p {
    color: rgba(242,236,216,0.75);
    font-size: 1rem;
    line-height: 1.7;
    max-width: 540px;
  }

  /* FILTERS */
  .controls {
    padding: 32px 60px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .controls label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--moss);
    margin-right: 4px;
  }

  .filter-btn {
    padding: 6px 16px;
    border-radius: 100px;
    border: 1.5px solid var(--sage);
    background: transparent;
    color: var(--earth);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--earth);
    border-color: var(--earth);
    color: var(--sand);
  }

  .search-wrap {
    margin-left: auto;
  }

  .search-wrap input {
    border: 1.5px solid var(--sage);
    background: white;
    padding: 7px 16px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: var(--earth);
  }

  .search-wrap input::placeholder {
    color: var(--sage);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
    padding: 24px 60px 80px;
  }

  /* CARD */
  .card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(45,74,62,0.08);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(45,74,62,0.15);
  }

  .card-thumb {
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .card-thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Each card gets a theme color via JS */
  .card-thumb .thumb-icon {
    font-size: 64px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    transition: transform 0.3s;
  }

  .card:hover .thumb-icon {
    transform: scale(1.1);
  }

  .card-thumb .thumb-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.12;
    background-image: radial-gradient(circle, white 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .play-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: white;
    border-radius: 100px;
    padding: 5px 12px 5px 8px;
    font-size: 11px;
    font-weight: 500;
    color: var(--earth);
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }

  .play-badge svg {
    width: 14px;
    height: 14px;
    fill: var(--amber);
  }

  .card-body {
    padding: 20px 22px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--sand);
    color: var(--moss);
  }

  .card-body h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--earth);
    margin-bottom: 8px;
  }

  .card-body p {
    font-size: 13px;
    line-height: 1.65;
    color: #5a6e67;
    flex: 1;
    margin-bottom: 16px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--sand);
    padding-top: 12px;
    margin-top: auto;
  }

  .card-author {
    font-size: 12px;
    color: var(--moss);
    font-weight: 400;
  }

  .card-author span {
    font-weight: 500;
    color: var(--earth);
  }

  .card-grade {
    font-size: 11px;
    font-weight: 500;
    color: var(--amber);
    letter-spacing: 0.05em;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,40,32,0.7);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: white;
    border-radius: 20px;
    max-width: 780px;
    width: 100%;
    overflow: hidden;
    transform: translateY(24px) scale(0.97);
    transition: transform 0.3s;
    max-height: 90vh;
    display: flex;
    flex-direction: row;
  }

  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-header {
    width: 240px;
    min-width: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-size: 60px;
    flex-shrink: 0;
  }

  .modal-header img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .modal-header .thumb-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.12;
    background-image: radial-gradient(circle, white 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255,255,255,0.9);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--earth);
    line-height: 1;
    z-index: 2;
  }

  .modal-body {
    padding: 28px 28px 32px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-body .card-tags { margin-bottom: 14px; }

  .modal-body h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--earth);
    margin-bottom: 8px;
    line-height: 1.25;
  }

  .modal-body .byline {
    font-size: 13px;
    color: var(--moss);
    margin-bottom: 18px;
  }

  .modal-body .byline strong {
    color: var(--earth);
    font-weight: 500;
  }

  .modal-body p {
    font-size: 14px;
    line-height: 1.75;
    color: #4a5e56;
    margin-bottom: 24px;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 22px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: none;
  }

  .btn-primary {
    background: var(--earth);
    color: var(--sand);
  }
  .btn-primary:hover { background: var(--moss); }

  .btn-secondary {
    background: var(--sand);
    color: var(--earth);
  }
  .btn-secondary:hover { background: #e8e0ca; }

  .modal-info-row {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    padding: 14px 0;
    border-top: 1px solid var(--sand);
    border-bottom: 1px solid var(--sand);
  }

  .modal-info-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .modal-info-item .info-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
  }

  .modal-info-item .info-val {
    font-size: 13px;
    font-weight: 500;
    color: var(--earth);
  }

  /* FOOTER */
  footer {
    background: var(--earth);
    color: var(--sage);
    padding: 32px 60px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  footer strong { color: var(--sand); }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--sage);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.1rem;
  }

  @media (max-width: 680px) {
    header { min-height: auto; }
    .header-content { padding: 32px 24px; }
    .controls { padding: 24px 24px 8px; flex-wrap: wrap; }
    .search-wrap { margin-left: 0; width: 100%; }
    .search-wrap input { width: 100%; }
    .grid {
      grid-template-columns: repeat(2, 1fr);
      padding: 16px 16px 60px;
      gap: 14px;
    }
    .card-body { padding: 12px 14px 14px; }
    .card-body h2 { font-size: 0.95rem; }
    .card-body p { font-size: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tag { font-size: 9px; padding: 2px 7px; }
    .card-author { font-size: 11px; }
    .play-badge { font-size: 10px; padding: 4px 8px 4px 6px; }
    footer { padding: 20px 24px; flex-direction: column; align-items: flex-start; gap: 6px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-bg"></div>
  <div class="header-content">
    <div class="eyebrow">Read Aloud · Learn · Explore</div>
    <h1>Climate <em>Storybooks</em><br>Read Aloud</h1>
    <p>Climate stories written and read aloud by Susquehanna University students, for curious kids and the people who teach them.</p>
  </div>
</header>

<div class="controls">
  <label>Topic</label>
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="ocean">Ocean</button>
  <button class="filter-btn" data-filter="weather">Weather</button>
  <button class="filter-btn" data-filter="wildlife">Wildlife</button>
  <button class="filter-btn" data-filter="ice">Ice & Snow</button>
  <button class="filter-btn" data-filter="community">Community</button>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search stories…">
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header" id="modal-header">
      <div class="thumb-pattern"></div>
      <span id="modal-icon"></span>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="card-tags" id="modal-tags"></div>
      <h2 id="modal-title"></h2>
      <div class="byline" id="modal-byline"></div>
      <div class="modal-info-row" id="modal-info"></div>
      <p id="modal-desc"></p>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</div>

<footer>
  <div><strong>Climate Storybooks</strong> · Susquehanna University</div>
  <div>EENV-242: Climate and Global Change</div>
</footer>

<script>
const THEMES = [
  { key: 'ocean',     color: '#3A7CA5', bg: 'linear-gradient(135deg,#3A7CA5,#5AABCD)', icon: '🌊' },
  { key: 'weather',   color: '#7B9E3A', bg: 'linear-gradient(135deg,#5C8227,#9DBF4A)', icon: '⛈️' },
  { key: 'wildlife',  color: '#C07B2E', bg: 'linear-gradient(135deg,#C07B2E,#E8A44A)', icon: '🦋' },
  { key: 'ice',       color: '#4A8FAD', bg: 'linear-gradient(135deg,#4A8FAD,#A4D4E8)', icon: '🧊' },
  { key: 'community', color: '#7A5CA5', bg: 'linear-gradient(135deg,#7A5CA5,#B09CD4)', icon: '🏡' },
];

// Placeholder stories — swap in real data
const STORIES = [
  {
    id: 1,
    title: "Where Did the Pikas Go?",
    author: "Siobhan Fathel",
    //grade: "Grades K–2",
    topic: "wildlife",
    duration: "3:05",
    summary: "Meet Pip, a small pika with big cheeks and a haypile to build. When the mountain gets too warm, Pip has to figure out where to go — and learns he is not alone.",
    description: "Where Did the Pikas Go? follows Pip, an American pika living in the cool rocky mountains of western North America. When rising temperatures make his habitat too warm, Pip must climb higher — only to find less food waiting at the top. Along the way, Pip meets scientists studying how pikas are responding to a warming world, and discovers that even small animals are part of something bigger. Based on real research on pika population change and climate adaptation.",
    themes: ["Wildlife", "Adaptation"],
hasVideo: true,
    hasPDF: true,
    imageUrl: "book_covers/Fathel_Pikas.png",
    videoUrl: "https://youtu.be/hFR3WHYK1Aw",
    pdfUrl: "book_pdfs/Fathel_Pikas.pdf",
    guideUrl: "",
  },
  {
    id: 2,
    title: "The Storm That Wouldn't Quit",
    author: "Jordan Ellis",
    //grade: "Grades 2–4",
    topic: "weather",
    duration: "5:10",
    summary: "When Grandma's town floods for the third summer in a row, Lily starts asking why storms seem bigger than ever. A multigenerational story about climate and memory.",
    description: "Explores changing precipitation patterns and extreme weather events through the relationship between a grandmother and grandchild. Includes discussion prompts about community resilience.",
    themes: ["Weather", "Community"],
hasVideo: true,
    hasPDF: true,
    imageUrl: "",
    videoUrl: "",
    pdfUrl: "",
    guideUrl: "",
  },
  {
    id: 3,
    title: "The Monarch's Long Journey",
    author: "Sam Reyes",
    grade: "Grades 1–3",
    topic: "wildlife",
    duration: "3:58",
    summary: "A young monarch butterfly embarks on her first migration, only to find that the milkweed meadows she needs are harder to find than ever before.",
    description: "Follows a monarch butterfly's migration to illustrate habitat loss and the role of temperature shifts in disrupting animal behavior. Pairs well with science activities about life cycles.",
    themes: ["Wildlife", "Migration"],
hasVideo: true,
    hasPDF: false,
    imageUrl: "",
    videoUrl: "",
    pdfUrl: "",
    guideUrl: "",
  },
  {
    id: 4,
    title: "Mia and the Melting Mountain",
    author: "Taylor Park",
    grade: "Grades 3–5",
    topic: "ice",
    duration: "6:05",
    summary: "Mia's family has hiked to the same glacier every year for four generations. This year, she notices something missing — and asks her geologist aunt to explain.",
    description: "Uses a family hiking tradition to explore glacial retreat and sea level rise. Includes data-driven storytelling and prompts for comparing historical photographs with present-day images.",
    themes: ["Ice & Snow", "Family"],
hasVideo: false,
    hasPDF: true,
    imageUrl: "",
    videoUrl: "",
    pdfUrl: "",
    guideUrl: "",
  },
  {
    id: 5,
    title: "Our Neighborhood Garden",
    author: "Priya Nair",
    grade: "Grades K–2",
    topic: "community",
    duration: "4:15",
    summary: "When the seasons start arriving at the wrong time, Mrs. Rosa and her neighbors turn their block into a community garden — and discover they can grow food and hope together.",
    description: "A warm, solutions-focused story about how communities respond to shifting growing seasons. Emphasizes collective action and local food systems as climate responses.",
    themes: ["Community", "Food"],
hasVideo: true,
    hasPDF: true,
    imageUrl: "",
    videoUrl: "",
    pdfUrl: "",
    guideUrl: "",
  },
  {
    id: 6,
    title: "Too Hot for the Tide Pools",
    author: "Alex Wu",
    grade: "Grades 2–4",
    topic: "ocean",
    duration: "5:33",
    summary: "Every summer, Juno visits the tide pools with her dad. But this year, the starfish are gone and the anemones look different. A story of curiosity and careful observation.",
    description: "Introduces ocean acidification and intertidal ecology through a child scientist's eyes. Encourages observation skills and scientific curiosity. Includes a one-page field guide activity.",
    themes: ["Ocean", "Science"],
hasVideo: true,
    hasPDF: true,
    imageUrl: "",
    videoUrl: "",
    pdfUrl: "",
    guideUrl: "",
  },
];

function getTheme(key) {
  return THEMES.find(t => t.key === key) || THEMES[0];
}

function renderCards(stories) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!stories.length) {
    grid.innerHTML = '<div class="no-results">No stories match your search.</div>';
    return;
  }
  stories.forEach(s => {
    const theme = getTheme(s.topic);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = s.id;
    card.innerHTML = `
      <div class="card-thumb" style="background:${s.imageUrl ? '#f5f5f5' : theme.bg}">
        ${s.imageUrl
          ? '<img src="' + s.imageUrl + '" alt="' + s.title + ' book cover">'
          : '<div class="thumb-pattern"></div><span class="thumb-icon">' + theme.icon + '</span>'
        }
        ${s.hasVideo ? `<div class="play-badge">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          ${s.duration}
        </div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-tags">
          ${s.themes.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <h2>${s.title}</h2>
        <p>${s.summary}</p>
        <div class="card-meta">
          <div class="card-author">By <span>${s.author}</span></div>
          <!-- <div class="card-grade">${s.grade}</div> -->
        </div>
      </div>
    `;
    card.addEventListener('click', () => openModal(s));
    grid.appendChild(card);
  });
}

function openModal(s) {
  const theme = getTheme(s.topic);
  const modalHeader = document.getElementById('modal-header');
  modalHeader.style.background = s.imageUrl ? '#f5f5f5' : theme.bg;
  // Remove any existing image
  const existingImg = modalHeader.querySelector('img');
  if (existingImg) existingImg.remove();
  if (s.imageUrl) {
    const img = document.createElement('img');
    img.src = s.imageUrl;
    img.alt = s.title + ' book cover';
    modalHeader.insertBefore(img, modalHeader.firstChild);
    document.getElementById('modal-icon').textContent = '';
  } else {
    document.getElementById('modal-icon').textContent = theme.icon;
  }
  document.getElementById('modal-title').textContent = s.title;
  document.getElementById('modal-byline').innerHTML = `Written and read aloud by <strong>${s.author}</strong>`;
  document.getElementById('modal-tags').innerHTML = s.themes.map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('modal-desc').textContent = s.description;
  document.getElementById('modal-info').innerHTML = `
    <!-- <div class="modal-info-item">
      <span class="info-label">Grade Level</span>
      <span class="info-val">${s.grade}</span>
    </div> -->
    ${s.hasVideo ? `<div class="modal-info-item">
      <span class="info-label">Video Length</span>
      <span class="info-val">${s.duration}</span>
    </div>` : ''}
    <div class="modal-info-item">
      <span class="info-label">Materials</span>
      <span class="info-val">${[s.hasVideo && 'Video', s.hasPDF && 'Printable Book'].filter(Boolean).join(' · ')}</span>
    </div>
  `;
  document.getElementById('modal-actions').innerHTML = `
    ${s.hasVideo ? `<a href="${s.videoUrl || '#'}" target="_blank" class="btn btn-primary" ${!s.videoUrl ? 'style="opacity:0.4;pointer-events:none;"' : ''}>▶ Watch Read-Aloud</a>` : ''}
    ${s.hasPDF ? `<a href="${s.pdfUrl || '#'}" target="_blank" class="btn btn-secondary" ${!s.pdfUrl ? 'style="opacity:0.4;pointer-events:none;"' : ''}>📄 Download Book (PDF)</a>` : ''}
    <a href="${s.guideUrl || '#'}" target="_blank" class="btn btn-secondary" ${!s.guideUrl ? 'style="opacity:0.4;pointer-events:none;"' : ''}>📋 Activity Guide</a>
  `;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

// Filters
let activeFilter = 'all';
let searchTerm = '';

function applyFilters() {
  let filtered = STORIES;
  if (activeFilter !== 'all') filtered = filtered.filter(s => s.topic === activeFilter);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    filtered = filtered.filter(s =>
      s.title.toLowerCase().includes(q) ||
      s.author.toLowerCase().includes(q) ||
      s.summary.toLowerCase().includes(q) ||
      s.themes.some(t => t.toLowerCase().includes(q))
    );
  }
  renderCards(filtered);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  applyFilters();
});

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// Init
renderCards(STORIES);
</script>
</body>
</html>
